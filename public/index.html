<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Worker Live Location</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { height: 100%; }
  .legend {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: white; padding: 10px 14px; border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2); font-size: 13px;
  }
  .legend div { margin: 4px 0; display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .online { background: #22c55e; }
  .stale { background: #f59e0b; }
  .offline { background: #ef4444; }
  .unknown { background: #9ca3af; }
</style>
</head>
<body>
<div id="map"></div>
<div class="legend">
  <strong>Status</strong>
  <div><span class="dot online"></span> Online (&lt; 2 min)</div>
  <div><span class="dot stale"></span> Stale (2&ndash;10 min)</div>
  <div><span class="dot offline"></span> Offline (&gt; 10 min)</div>
  <div><span class="dot unknown"></span> Never reported</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const map = L.map('map').setView([1.3521, 103.8198], 12); // defaults to Singapore, adjust as needed
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const colors = { online: '#22c55e', stale: '#f59e0b', offline: '#ef4444', unknown: '#9ca3af' };
  const markers = {}; // device id -> Leaflet marker

  async function refresh() {
    try {
      const res = await fetch('/api/devices');
      const list = await res.json();

      list.forEach(d => {
        if (typeof d.lat !== 'number' || typeof d.lng !== 'number') return;
        const color = colors[d.status] || colors.unknown;
        const title = d.name ? `${d.name}` : d.id;
        const subtitle = d.name ? `<br><span style="color:#888;font-size:11px">${d.id}</span>` : '';
        const label = `<b>${title}</b>${subtitle}<br>Status: ${d.status}<br>` +
                      (d.battery != null ? `Battery: ${d.battery}%<br>` : '') +
                      (d.ts ? `Last update: ${new Date(d.ts).toLocaleTimeString()}` : '');

        if (markers[d.id]) {
          markers[d.id].setLatLng([d.lat, d.lng]);
          markers[d.id].setStyle({ fillColor: color, color });
          markers[d.id].setPopupContent(label);
        } else {
          markers[d.id] = L.circleMarker([d.lat, d.lng], {
            radius: 9, fillColor: color, color, weight: 2, fillOpacity: 0.9
          }).addTo(map).bindPopup(label);
        }
      });
    } catch (e) {
      console.error('Failed to refresh devices', e);
    }
  }

  refresh();
  setInterval(refresh, 5000); // poll every 5 seconds
</script>
</body>
</html>
